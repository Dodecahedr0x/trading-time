[package]
name = "tradingtime-web"
edition.workspace = true
version.workspace = true

[lib]
name = "tradingtime_web"
path = "src/lib.rs"

[[bin]]
name = "tradingtime-web"
path = "src/main.rs"

[dependencies]
dioxus.workspace = true
wallet-adapter.workspace = true
tradingtime-interface.workspace = true
tradingtime-math.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
bytemuck.workspace = true
futures.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-instruction.workspace = true
solana-message = { workspace = true, features = ["wincode"] }
solana-hash.workspace = true
bs58 = "0.5.1"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "MediaQueryList", "Performance", "Document", "Element", "DomRect", "History", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }
