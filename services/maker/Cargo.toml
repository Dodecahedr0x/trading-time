[package]
name = "tradingtime-maker"
edition.workspace = true
version.workspace = true

[lib]
name = "tradingtime_maker"
path = "src/lib.rs"

[[bin]]
name = "tradingtime-maker"
path = "src/main.rs"
required-features = ["rpc"]

[features]
default = ["rpc"]
rpc = ["tradingtime-client/rpc"]

[dependencies]
tradingtime-client.workspace = true
tradingtime-interface.workspace = true
tradingtime-math.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-keypair.workspace = true
solana-signer.workspace = true
solana-instruction.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
bytemuck.workspace = true
