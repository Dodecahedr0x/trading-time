[package]
name = "tradingtime-bots"
edition.workspace = true
version.workspace = true

[lib]
name = "tradingtime_bots"
path = "src/lib.rs"

[[bin]]
name = "tradingtime-bots"
path = "src/main.rs"
required-features = ["rpc"]

[features]
default = ["rpc"]
rpc = ["tradingtime-client/rpc"]

[dependencies]
tradingtime-client.workspace = true
tradingtime-interface.workspace = true
tradingtime-math.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-keypair.workspace = true
solana-signer.workspace = true
solana-instruction.workspace = true
